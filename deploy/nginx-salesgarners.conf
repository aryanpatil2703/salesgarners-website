# Nginx Reverse Proxy Configuration for SalesGarners Next.js & AI Chatbot
# Place in: /etc/nginx/sites-available/salesgarners.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/salesgarners.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name salesgarners.com www.salesgarners.com;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name salesgarners.com www.salesgarners.com;

    # SSL Certificate Paths (generated by Certbot)
    # ssl_certificate /etc/letsencrypt/live/salesgarners.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/salesgarners.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Upload limit for whitepaper PDF uploads in admin panel
    client_max_body_size 25M;

    # Next.js Static Cache Optimization
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }

    # Public static media files
    location /public/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        access_log off;
    }

    # Real-Time AI Chatbot Streaming Route
    # CRITICAL: Disable proxy buffering so tokens stream in real time (<400ms TTFT)
    location /api/chat {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Disable Nginx chunk buffering for real-time SSE / NDJSON streams
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        chunked_transfer_encoding on;

        # Extended timeout for long generations
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Standard client IP forwarding for rate limiting
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main Application Proxy
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}

